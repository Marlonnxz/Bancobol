spring.application.name=banco-cobol
# Saldo persistente en archivo local (./data/banco.mv.db).
# LOCK_TIMEOUT: si otra operacion tiene bloqueada la cuenta mas de 5 s, se aborta en vez de esperar.
spring.datasource.url=jdbc:h2:file:./data/banco;LOCK_TIMEOUT=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Ninguna transaccion bancaria puede durar mas de 10 s
spring.transaction.default-timeout=10s

# DLL con las operaciones COBOL (se genera con compilar-dll.ps1) y carpeta del runtime de GnuCOBOL
banco.cobol.dll=./dll/banco.dll
banco.cobol.runtime=C:/msys64/mingw64/bin
